# Entity selection and replacement guide: README.md#entity-mapping
# Replace full entity IDs at every occurrence; names only change display labels.
title: UniFi
views:
  - title: Network
    path: unifi
    icon: mdi:lan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
              rows: auto
            card_mod:
              style: |
                :host {
                  container-type: inline-size;
                  container-name: unifi-header;
                  background: var(--ha-card-background, var(--card-background-color));
                  border: 1px solid var(--divider-color);
                  border-left: 4px solid #0099e8;
                  border-radius: 8px;
                  padding: 16px;
                  box-sizing: border-box;
                }
                #root {
                  align-items: center;
                  gap: 16px;
                }
                @container unifi-header (max-width: 700px) {
                  #root { grid-template-columns: minmax(0, 1fr); }
                }
            cards:
              - type: markdown
                content: |
                  # UniFi Network
                  Network overview
                card_mod:
                  style: |
                    ha-card {
                      background: transparent;
                      border: none;
                      box-shadow: none;
                      color: #0099e8;
                    }
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: "**UniFi Dream Router**"
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent;
                          border: none;
                          box-shadow: none;
                        }
                  - type: sensor
                    # Router CPU: numeric sensor, 0-100 percent (not a load average).
                    entity: sensor.dream_router_cpu_utilization
                    name: CPU
                    graph: line
                    detail: 2
                    hours_to_show: 24
                    card_mod:
                      style:
                        .: |
                          {% set value = states(config.entity) %}
                          ha-card {
                            --accent-color:
                              {% if not is_number(value) %}var(--disabled-text-color)
                              {% elif value | float >= 61 %}var(--error-color)
                              {% elif value | float >= 31 %}var(--warning-color)
                              {% else %}var(--success-color){% endif %};
                            background: transparent;
                            border: none;
                            box-shadow: none;
                          }
                          .header { padding: 0 8px; }
                          .name { font-size: 13px; line-height: 28px; }
                          .icon { line-height: 28px; }
                          .info { padding: 0 8px 4px; margin-top: 0; }
                          .value { font-size: 20px; }
                        hui-graph-header-footer $: |
                          .container { padding-bottom: 40px; }
                  - type: sensor
                    # Router memory: utilization percent, not used/free bytes.
                    entity: sensor.dream_router_memory_utilization
                    name: Memory
                    graph: line
                    detail: 2
                    hours_to_show: 24
                    card_mod:
                      style:
                        .: |
                          {% set value = states(config.entity) %}
                          ha-card {
                            --accent-color:
                              {% if not is_number(value) %}var(--disabled-text-color)
                              {% elif value | float >= 61 %}var(--error-color)
                              {% elif value | float >= 31 %}var(--warning-color)
                              {% else %}var(--success-color){% endif %};
                            background: transparent;
                            border: none;
                            box-shadow: none;
                          }
                          .header { padding: 0 8px; }
                          .name { font-size: 13px; line-height: 28px; }
                          .icon { line-height: 28px; }
                          .info { padding: 0 8px 4px; margin-top: 0; }
                          .value { font-size: 20px; }
                        hui-graph-header-footer $: |
                          .container { padding-bottom: 40px; }
                  - type: sensor
                    # Router CPU temperature in Celsius; adjust thresholds for Fahrenheit.
                    entity: sensor.dream_router_dream_router_cpu_temperature
                    name: Temperature
                    graph: line
                    detail: 2
                    hours_to_show: 24
                    card_mod:
                      style:
                        .: |
                          {% set value = states(config.entity) %}
                          ha-card {
                            --accent-color:
                              {% if not is_number(value) %}var(--disabled-text-color)
                              {% elif value | float >= 61 %}var(--error-color)
                              {% elif value | float >= 31 %}var(--warning-color)
                              {% else %}var(--success-color){% endif %};
                            background: transparent;
                            border: none;
                            box-shadow: none;
                          }
                          .header { padding: 0 8px; }
                          .name { font-size: 13px; line-height: 28px; }
                          .icon { line-height: 28px; }
                          .info { padding: 0 8px 4px; margin-top: 0; }
                          .value { font-size: 20px; }
                        hui-graph-header-footer $: |
                          .container { padding-bottom: 40px; }
          - type: grid
            # Five traffic cards occupy six columns: WAN spans two, each client chart one.
            columns: 6
            square: false
            grid_options:
              columns: full
              rows: auto
            card_mod:
              style: |
                :host {
                  container-type: inline-size;
                  container-name: unifi-traffic;
                }
                #root { gap: 8px; }
                #root > hui-card:first-child { grid-column: span 2; }
                @container unifi-traffic (max-width: 900px) {
                  #root { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                }
                @container unifi-traffic (max-width: 450px) {
                  #root { grid-template-columns: minmax(0, 1fr); }
                  #root > hui-card:first-child { grid-column: auto; }
                }
            cards:
              - type: history-graph
                title: WAN traffic
                hours_to_show: 168
                entities:
                  # Same WAN port, numeric rates with matching units; not byte totals/link speed.
                  - entity: sensor.dream_router_port_5_tx
                    name: Port 5 TX
                    color: "#0099e8"
                  - entity: sensor.dream_router_port_5_rx
                    name: Port 5 RX
                    color: "#ff9800"
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --ha-card-header-font-size: 14px;
                    }
              - type: sensor
                # Connected wired-client count; also replace this ID in LAN details.
                entity: sensor.dream_router_connected_lan_clients
                name: LAN clients
                icon: mdi:lan
                graph: line
                detail: 1
                hours_to_show: 168
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --accent-color: #ff9800;
                    }
                    .name { font-size: 14px; }
                    .value { font-size: 24px; }
              - type: sensor
                # Connected Wi-Fi-client count; also replace this ID in Wi-Fi details.
                entity: sensor.dream_router_wlan_users
                name: Wi-Fi clients
                icon: mdi:wifi
                graph: line
                detail: 1
                hours_to_show: 168
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --accent-color: #ff9800;
                    }
                    .name { font-size: 14px; }
                    .value { font-size: 24px; }
              - type: sensor
                # Main SSID's numeric client count; also used in Wi-Fi details.
                entity: sensor.wlan_main_clients
                name: Main Wi-Fi
                icon: mdi:wifi
                graph: line
                detail: 1
                hours_to_show: 168
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --accent-color: #ff9800;
                    }
                    .name { font-size: 14px; }
                    .value { font-size: 24px; }
              - type: sensor
                # Guest SSID's numeric client count; remove both references if absent.
                entity: sensor.wlan_guest_clients
                name: Guest Wi-Fi
                icon: mdi:wifi
                graph: line
                detail: 1
                hours_to_show: 168
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --accent-color: #ff9800;
                    }
                    .name { font-size: 14px; }
                    .value { font-size: 24px; }
          - type: grid
            columns: 3
            square: false
            grid_options:
              columns: full
              rows: auto
            card_mod:
              style: |
                :host {
                  container-type: inline-size;
                  container-name: unifi-devices;
                }
                #root { align-items: start; gap: 8px; }
                @container unifi-devices (max-width: 700px) {
                  #root { grid-template-columns: minmax(0, 1fr); }
                }
            cards:
              - type: entities
                title: Client access
                show_header_toggle: false
                entities:
                  # Client internet/network access switches: on = allowed, off = blocked; verify first.
                  - entity: switch.client_1
                    name: Client 1
                    secondary_info: last-changed
                  - entity: switch.client_2
                    name: Client 2
                    secondary_info: last-changed
                  - entity: switch.client_3
                    name: Client 3
                    secondary_info: last-changed
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --ha-card-header-font-size: 16px;
                    }
              - type: entities
                title: LAN
                show_header_toggle: false
                entities:
                  # Router uptime sensor: duration or startup timestamp, not a client last-seen value.
                  - entity: sensor.dream_router_uptime
                    name: Uptime
                    icon: mdi:clock-outline
                  - entity: sensor.dream_router_connected_lan_clients
                    name: Connected clients
                    icon: mdi:lan
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --ha-card-header-font-size: 16px;
                    }
              - type: entities
                title: Wi-Fi
                show_header_toggle: false
                entities:
                  - entity: sensor.dream_router_wlan_users
                    name: Connected clients
                    icon: mdi:wifi
                  - entity: sensor.wlan_main_clients
                    name: Main Wi-Fi
                    icon: mdi:access-point-network
                  - entity: sensor.wlan_guest_clients
                    name: Guest Wi-Fi
                    icon: mdi:wifi
                  # Numeric disconnected-client count for this SSID, not a binary status.
                  - entity: sensor.wlan_main_disconnected_clients
                    name: Main Wi-Fi disconnected
                    icon: mdi:wifi-off
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                      --ha-card-header-font-size: 16px;
                    }
          - type: grid
            columns: 3
            square: false
            grid_options:
              columns: full
              rows: auto
            card_mod:
              style: |
                :host {
                  container-type: inline-size;
                  container-name: unifi-status;
                }
                #root { align-items: start; gap: 8px; }
                #root > hui-card:nth-child(2) { grid-column: span 2; }
                @container unifi-status (max-width: 700px) {
                  #root { grid-template-columns: minmax(0, 1fr); }
                  #root > hui-card:nth-child(2) { grid-column: auto; }
                }
            cards:
              - type: tile
                # Router firmware update entity, not a restart button or HA Core update.
                entity: update.dream_router
                name: Firmware
                tap_action:
                  action: more-info
                icon_tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 8px;
                      box-shadow: none;
                    }
              - type: entity-filter
                entities:
                  # Router-backed client trackers with home/not_home states; not person or binary_sensor.
                  - entity: device_tracker.client_1
                    name: Client 1
                    secondary_info: last-changed
                  - entity: device_tracker.client_2
                    name: Client 2
                    secondary_info: last-changed
                  - entity: device_tracker.client_3
                    name: Client 3
                    secondary_info: last-changed
                conditions:
                  - condition: state
                    state: not_home
                show_empty: true
                card:
                  type: entities
                  title: Offline clients
                  show_header_toggle: false
                  card_mod:
                    style: |
                      ha-card {
                        border-radius: 8px;
                        box-shadow: none;
                        --ha-card-header-font-size: 16px;
                      }
